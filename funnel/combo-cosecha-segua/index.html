height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <!-- Barra de urgencia (header) -->
  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <div class="topbar__meta">
        <span class="topbar__promo">🔥 Oferta Exclusiva</span>
        <span class="topbar__timerchip">
          <svg class="topbar__timer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="timer">00:00:00</span>
        </span>
        <span class="topbar__stock">⚠️ Solo 7 unidades</span>
      </div>
      <button class="topbar__cta js-open-modal" type="button">¡Comprar YA!</button>
    </div>
  </header>

  <!-- Funnel 100% imágenes -->
  <main class="wrap">
    <img src="images/1.webp" alt="">
    <img src="images/2.webp" alt="">

    <div class="cta-proof cta-proof--boxed" aria-label="Urgencia y escasez">
      <div class="proof-head">⚡ Oferta termina en</div>
      <div class="countdown" role="group" aria-label="Cuenta regresiva">
        <div class="cd-group">
          <div class="cd-box"><span class="cd-digit js-cd-h1">0</span></div>
          <div class="cd-box"><span class="cd-digit js-cd-h2">0</span></div>
          <div class="cd-label">Horas</div>
        </div>
        <div class="cd-sep">:</div>
        <div class="cd-group">
          <div class="cd-box"><span class="cd-digit js-cd-m1">0</span></div>
          <div class="cd-box"><span class="cd-digit js-cd-m2">0</span></div>
          <div class="cd-label">Min</div>
        </div>
        <div class="cd-sep">:</div>
        <div class="cd-group">
          <div class="cd-box"><span class="cd-digit js-cd-s1">0</span></div>
          <div class="cd-box"><span class="cd-digit js-cd-s2">0</span></div>
          <div class="cd-label">Seg</div>
        </div>
      </div>
      <div class="proof-row">
        <span class="badge badge--danger">⚠️ Quedan <strong class="js-stock">7</strong> unidades</span>
        <span class="badge badge--muted">👀 <strong class="js-live">5</strong> viendo ahora</span>
      </div>
      <div class="section-cta">
        <button class="btn btn--big pulsar-boton js-open-modal">¡Comprar ahora!</button>
      </div>
    </div>

    <img src="images/3.webp" alt="">
    <img src="images/4.webp" alt="">
    <img src="images/5.webp" alt="">

    <div class="section-cta">
      <button class="btn btn--big pulsar-boton js-open-modal">Quiero mi promo</button>
    </div>

    <img src="images/6.webp" alt="">
    <img src="images/7.webp" alt="">

    <div class="section-cta">
      <button class="btn btn--big pulsar-boton js-open-modal">Finalizar pedido</button>
    </div>

    <img src="images/8.webp" alt="">
    <img src="images/9.webp" alt="">

    <div class="section-cta">
      <button class="btn btn--big pulsar-boton js-open-modal">Finalizar pedido</button>
    </div>

    <div class="spacer"></div>
  </main>

  <!-- Botón fijo inferior -->
  <button class="bottom-cta js-open-modal" id="bottomCta">Comprar ahora</button>

  <!-- El modal se inyecta aquí desde modal.js -->
  <div id="modal-container"></div>
